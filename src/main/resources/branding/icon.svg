<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TownsRPG logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="tile"><rect width="128" height="128" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="#0A0E1A"/>
    <circle cx="97" cy="33" r="11" fill="#A85A1E"/>
    <rect y="100" width="128" height="28" fill="#1F3A2E"/>

    <!-- left house -->
    <rect x="18" y="72" width="28" height="28" fill="#4A5470"/>
    <polygon points="13,74 32,54 51,74" fill="#7A2E22"/>
    <rect x="28" y="82" width="8" height="8" fill="#D9822B"/>

    <!-- right house -->
    <rect x="82" y="76" width="26" height="24" fill="#4A5470"/>
    <polygon points="77,78 95,60 113,78" fill="#7A2E22"/>
    <rect x="91" y="85" width="8" height="8" fill="#D9822B"/>

    <!-- central tower -->
    <rect x="52" y="46" width="24" height="54" fill="#4A5470"/>
    <polygon points="47,48 64,20 81,48" fill="#7A2E22"/>
    <rect x="60" y="56" width="8" height="10" rx="4" fill="#D9822B"/>
    <path d="M58 100 V86 a6 6 0 0 1 12 0 V100 Z" fill="#0A0E1A"/>

    <!-- path to the door -->
    <polygon points="58,100 70,100 82,128 46,128" fill="#39435C"/>
  </g>
</svg>
