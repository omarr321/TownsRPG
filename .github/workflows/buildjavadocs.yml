name: Generating JavaDocs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-or-installer
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Javadocs via Maven
        run: mvn javadoc:javadoc

      - name: Assemble site
        run: |
          mkdir -p _site/javadoc
          cp -r target/reports/apidocs/* _site/javadoc/
          cp -r site/* _site/
          cp -r src/main/resources/branding _site/branding
          cp README.md _site/README.md
          ls -R _site | head -40

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}