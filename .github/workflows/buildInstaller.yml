name: Build Native Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-or-installer
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: ubuntu-latest # Change to windows-latest or macos-latest if targeting those OSes specifically

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Package your app and run jpackage (via Maven plugin or exec)
      - name: Build Native Package via Maven
        run: mvn clean package # Make sure your pom.xml includes the jpackage execution

      # 2. Isolate ONLY the final installer, excluding source code and workflows
      - name: Prepare Release Artifact
        run: |
          mkdir -p release-bundle
          # Copy only the built native installer from target/ (e.g., .deb, .rpm, .msi, etc.)
          find target -name "*.deb" -o -name "*.rpm" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -exec cp {} release-bundle/ \;
          ls -R release-bundle

      - name: Upload Native Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-installer-${{ github.run_attempt }}
          path: release-bundle/