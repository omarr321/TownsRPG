name: Build Native Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-or-installer
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Native Package via Maven
        run: mvn clean package

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-bundle
          # Copy the generated installer from the dedicated jpackage destination folder
          cp target/installer/*.deb release-bundle/
          ls -R release-bundle

      - name: Upload Native Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-installer-${{ github.run_attempt }}
          path: release-bundle/