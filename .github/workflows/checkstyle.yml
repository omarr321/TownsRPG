name: checkstyle.yml
on:
  workflow_run:
    workflows: [ "JaCoCo Coverage" ]   # must match the name: above exactly
    types: [ completed ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Checkstyle via Maven
        run: mvn validate
