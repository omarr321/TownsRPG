name: Checking Checkstyle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check