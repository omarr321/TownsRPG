name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Run Maven test and generate JaCoCo coverage report
      # - run: mvn -B clean test jacoco:report
      - run: mvn -B clean verify

      # Optional: Enforce a minimum coverage check on PR lines/overall code
      - name: JaCoCo Report to PR
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-lines: 90
          update-comment: true