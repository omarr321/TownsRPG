<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Towns RPG engine</title>
    <link rel="icon" type="image/svg+xml" href="branding/icon.svg">
    <style>
        :root { --bg:#0A0E1A; --surface:#121829; --fg:#C4C8D4; --muted:#8E94A8; --border:#39435C;
            --link:#D9822B; --link-hover:#F0A24F; --brick:#7A2E22; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--fg);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
        main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
        a { color:var(--link); }
        a:hover { color:var(--link-hover); }
        img { max-width:100%; }
        h1, h2, h3 { color:#E4E6EC; }
        h1, h2 { border-bottom:1px solid var(--border); padding-bottom:.3em; }
        pre, code { background:var(--surface); border-radius:6px; }
        code { padding:.15em .35em; }
        pre { padding:16px; overflow-x:auto; border:1px solid var(--border); }
        pre code { padding:0; border:0; }
        table { border-collapse:collapse; display:block; overflow-x:auto; }
        th, td { border:1px solid var(--border); padding:6px 13px; }
        th { background:var(--surface); }
        blockquote { margin:0; padding:0 1em; color:var(--muted); border-left:4px solid var(--brick); }
        hr { border:0; border-top:1px solid var(--border); }
    </style>
</head>
<body>
<script src="nav.js"></script>

<main id="content">Loading…</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
    fetch('README.md')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (md) { document.getElementById('content').innerHTML = marked.parse(md); })
        .catch(function () { document.getElementById('content').textContent = 'Could not load README.'; });
</script>
</body>
</html>
