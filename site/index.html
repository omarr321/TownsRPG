<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TownsRPG</title>
    <style>
        :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --border:#30363d; --link:#4493f8; --code:#161b22; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--fg);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
        main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
        a { color:var(--link); }
        img { max-width:100%; }
        pre, code { background:var(--code); border-radius:6px; }
        code { padding:.15em .35em; }
        pre { padding:16px; overflow-x:auto; }
        pre code { padding:0; }
        table { border-collapse:collapse; display:block; overflow-x:auto; }
        th, td { border:1px solid var(--border); padding:6px 13px; }
        h1, h2 { border-bottom:1px solid var(--border); padding-bottom:.3em; }
        blockquote { margin:0; padding:0 1em; color:var(--muted); border-left:4px solid var(--border); }
    </style>
</head>
<body>
<script src="/site/nav.js"></script>

<main id="content">Loading…</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
    fetch('/README.md')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (md) { document.getElementById('content').innerHTML = marked.parse(md); })
        .catch(function () { document.getElementById('content').textContent = 'Could not load README.'; });
</script>
</body>
</html>
